<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — Car Curator</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-shell"><a class="auth-back" href="index.html">&larr; Back to Car Curator</a><section class="auth-card"><h1>Create Account</h1><p class="auth-subtitle">Join Car Curator and keep your demo account ready.</p><form class="auth-form" data-mode="signup" novalidate><div class="auth-field"><label for="name">Full Name</label><input id="name" name="name" type="text" autocomplete="name" required><span id="name-error" class="field-error"></span></div><div class="auth-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><span id="email-error" class="field-error"></span></div><div class="auth-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required><span id="password-error" class="field-error"></span></div><div class="auth-field"><label for="confirm-password">Confirm Password</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required><span id="confirm-error" class="field-error"></span></div><p id="auth-message" class="auth-message"></p><button class="btn-primary" type="submit">Create Account</button></form><div class="auth-links">Already have an account? <a href="signin.html">Sign in</a></div><div class="demo-note">Demo authentication: account data is stored locally in your browser using localStorage. No backend or real server authentication is connected.</div></section></main><script src="auth.js"></scrip
