<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Car Curator</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-shell"><a class="auth-back" href="index.html">&larr; Back to Car Curator</a><section class="auth-card"><h1>Welcome Back</h1><p class="auth-subtitle">Sign in to continue exploring Car Curator.</p><form class="auth-form" data-mode="signin" novalidate><div class="auth-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><span id="email-error" class="field-error"></span></div><div class="auth-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><span id="password-error" class="field-error"></span></div><p id="auth-message" class="auth-message"></p><button class="btn-primary" type="submit">Sign In</button></form><div class="auth-links">New to Car Curator? <a href="signup.html">Create an account</a></div><div class="demo-note">Demo authentication: account data is stored locally in your browser using localStorage. No backend or real server authentication is connected.</div></section></main><script src="auth.js"></script></body></html>
